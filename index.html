  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"e8fa2706-ffe9-4f8a-a2f9-bb7c00442f85\"><\u002Fscript>\n\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<title>TeamPulse - Project &amp; Task Lifecycle Tracker<\u002Ftitle>\n<script src=\"https://accounts.google.com/gsi/client\" async=\"\"><\u002Fscript>\n<script src=\"8fef5daa-e19b-4fef-8347-a5e29d09f7d8\"><\u002Fscript>\n<script src=\"50d35737-d4d9-412c-b6ea-edb34948a2df\"><\u002Fscript>\n<script src=\"c04accc2-330a-4219-9ea2-71b962b16ee2\"><\u002Fscript>\n<script src=\"e63ea41d-54d6-4ca4-986a-c0efd6c61851\"><\u002Fscript>\n<script src=\"feb06b81-04f3-4eeb-b2ae-81c542ff40a4\"><\u002Fscript>\n<style>\nhtml,body{margin:0;padding:0;background:#f4f7fa;color:#0f172a;font-family:ui-sans-serif,system-ui,sans-serif,\"Apple Color Emoji\",\"Segoe UI Emoji\";-webkit-font-smoothing:antialiased}\n*{box-sizing:border-box}\n::selection{background:#6366f1;color:#fff}\na{color:#4f46e5;text-decoration:none}\na:hover{color:#3730a3;text-decoration:underline}\ninput,select,textarea,button{font-family:inherit;color:inherit;font-size:inherit}\n@keyframes tp-bounce{0%,100%{transform:translateY(-25%);animation-timing-function:cubic-bezier(.8,0,1,1)}50%{transform:none;animation-timing-function:cubic-bezier(0,0,.2,1)}}\n@keyframes tp-pulse{50%{opacity:.5}}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<sc-if value=\"{{ loggedOut }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"min-height:100vh;background:#0f172a;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:16px;position:relative;overflow:hidden\">\n    <div style=\"position:absolute;top:25%;left:25%;width:384px;height:384px;background:rgba(79,70,229,0.2);border-radius:50%;filter:blur(64px);pointer-events:none\"><\u002Fdiv>\n    <div style=\"position:absolute;bottom:25%;right:25%;width:384px;height:384px;background:rgba(8,145,178,0.15);border-radius:50%;filter:blur(64px);pointer-events:none\"><\u002Fdiv>\n    <div style=\"position:relative;z-index:10;max-width:576px;width:100%;margin:auto 0\">\n      <div style=\"text-align:center;margin-bottom:24px;display:flex;flex-direction:column;align-items:center;gap:8px\">\n        <div style=\"display:inline-flex;align-items:center;justify-content:center;height:56px;width:56px;border-radius:16px;background:linear-gradient(to top right,#6366f1,#22d3ee);color:#fff;box-shadow:0 10px 15px -3px rgba(0,0,0,0.2);margin-bottom:8px\">\n          <svg width=\"28\" height=\"28\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z\"><\u002Fpath><path d=\"M8 10v4\"><\u002Fpath><path d=\"M12 10v2\"><\u002Fpath><path d=\"M16 10v6\"><\u002Fpath><\u002Fsvg>\n        <\u002Fdiv>\n        <h1 style=\"margin:0;font-size:30px;font-weight:800;color:#fff;letter-spacing:-0.025em\">TeamPulse Project Portal<\u002Fh1>\n        <p style=\"margin:0;font-size:14px;color:#cbd5e1;max-width:448px\">Sign in with your Google email to access and monitor project lifecycles<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"background:#fff;border-radius:24px;box-shadow:0 25px 50px -12px rgba(0,0,0,0.25);border:1px solid #e2e8f0;overflow:hidden\">\n        <div style=\"padding:32px;display:flex;flex-direction:column;gap:20px\">\n          <div>\n            <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;gap:8px\">\n              <h2 style=\"margin:0;font-size:18px;font-weight:700;color:#0f172a\">Google Account Sign-In<\u002Fh2>\n              <div style=\"display:flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;background:#f1f5f9;border:1px solid #e2e8f0;font-size:11px;font-weight:600;color:#334155\">\n                <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\"><path fill=\"#4285F4\" d=\"M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z\"><\u002Fpath><path fill=\"#34A853\" d=\"M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.290-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z\"><\u002Fpath><path fill=\"#FBBC05\" d=\"M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z\"><\u002Fpath><path fill=\"#EA4335\" d=\"M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z\"><\u002Fpath><\u002Fsvg>\n                <span>Google Auth<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <p style=\"margin:0;font-size:12px;color:#64748b\">Choose your team Google email or enter another Google Workspace account<\u002Fp>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ hasLoginError }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"padding:12px;border-radius:12px;background:#fff1f2;border:1px solid #fecdd3;font-size:12px;color:#be123c\">{{ loginError }}<\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ hasFirebase }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px;border-radius:16px;border:1px solid #e2e8f0;background:#f8fafc\">\n              <span style=\"font-size:11px;font-weight:700;color:#475569;text-transform:uppercase;letter-spacing:0.05em\">Verified Google Sign-In · Cloud Workspace<\u002Fspan>\n              <button type=\"button\" sc-camel-on-click=\"{{ firebaseSignIn }}\" style=\"display:flex;align-items:center;gap:12px;padding:10px 20px;border-radius:999px;background:#0f172a;color:#fff;font-weight:700;font-size:14px;border:none;cursor:pointer;white-space:nowrap\" style-hover=\"background <\u002Fdiv>\n    <sc-for list=\"{{ sideProjects }}\" as=\"sp\" hint-placeholder-count=\"1\">\n      <button sc-camel-on-click=\"{{ sp.onClick }}\" title=\"{{ sp.title }}\" style=\"display:flex;align-items:center;gap:10px;padding:8px 10px;border:none;border-radius:8px;cursor:pointer;text-align:left;background:{{ sp.bg }};color:{{ sp.color }}\" style-hover=\"background:#eef2ff\">\n        <span style=\"display:flex;flex-shrink:0\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"18\" height=\"18\" x=\"3\" y=\"3\" rx=\"2\"><\u002Frect><path d=\"M3 9h18\"><\u002Fpath><path d=\"M3 15h18\"><\u002Fpath><path d=\"M9 3v18\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n        <span style=\"display:flex;flex-direction:column;min-width:0\">\n          <span style=\"font-size:13.5px;font-weight:{{ sp.weight }};white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ sp.title }}<\u002Fspan>\n          <span style=\"font-size:11px;color:#94a3b8;font-family:ui-monospace,SFMono-Regular,Menlo,monospace\">{{ sp.code }} · {{ sp.count }} tasks<\u002Fspan>\n        <\u002Fspan>\n      <\u002Fbutton>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;gap:2px\">\n    <div style=\"display:flex;align-items:center;justify-content:space-between;padding:0 8px 6px\">\n      <span style=\"font-size:12px;font-weight:600;color:#64748b\">Core Team<\u002Fspan>\n      <button sc-camel-on-click=\"{{ allTeam.onClick }}\" style=\"border:none;background:none;cursor:pointer;font-size:11px;font-weight:600;color:#4f46e5;padding:0\">Show all<\u002Fbutton>\n    <\u002Fdiv>\n    <sc-for list=\"{{ sideTeam }}\" as=\"st\" hint-placeholder-count=\"4\">\n      <button sc-camel-on-click=\"{{ st.onClick }}\" title=\"{{ st.title }}\" style=\"display:flex;align-items:center;gap:10px;padding:7px 10px;border:none;border-radius:8px;cursor:pointer;text-align:left;background:{{ st.bg }}\" style-hover=\"background:#f1f5f9\">\n        <span style=\"height:26px;width:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;background:{{ st.av.bg }};color:{{ st.av.fg }}\">{{ st.initials }}<\u002Fspan>\n        <span style=\"font-size:13px;color:#1e293b;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:{{ st.weight }}\">{{ st.name }}<\u002Fspan>\n        <span style=\"font-size:11px;color:#94a3b8\">{{ st.count }}<\u002Fspan>\n      <\u002Fbutton>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <div style=\"margin-top:auto;display:flex;flex-direction:column;gap:10px\">\n    <div title=\"{{ sync.title }}\" style=\"display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:{{ sync.color }};background:{{ sync.bg }};border:1px solid {{ sync.border }};padding:6px 10px;border-radius:10px;white-space:nowrap\">\n      <span style=\"height:8px;width:8px;border-radius:50%;background:{{ sync.dot }};animation:tp-pulse 2s cubic-bezier(.4,0,.6,1) infinite\"><\u002Fspan><span>{{ sync.label }}<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:10px;padding:8px;border:1px solid #e2e8f0;border-radius:12px\">\n      <div style=\"height:32px;width:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;flex-shrink:0;background:{{ userAv.bg }};color:{{ userAv.fg }}\">{{ user.initials }}<\u002Fdiv>\n      <div style=\"min-width:0;flex:1;line-height:1.25\">\n        <div style=\"font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ user.name }}<\u002Fdiv>\n        <div style=\"font-size:10.5px;color:#64748b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ user.email }}<\u002Fdiv>\n      <\u002Fdiv>\n      <button sc-camel-on-click=\"{{ signOut }}\" title=\"Sign Out / Switch Google Account\" style=\"border:none;background:none;color:#94a3b8;cursor:pointer;padding:4px;border-radius:6px;display:flex\" style-hover=\"color:#e11d48;background:#fff1f2\"><svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4\"><\u002Fpath><polyline points=\"16 17 21 12 16 7\"><\u002Fpolyline><line x1=\"21\" x2=\"9\" y1=\"12\" y2=\"12\"><\u002Fline><\u002Fsvg><\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Faside>\n<div style=\"flex:1;min-width:0;display:flex;flex-direction:column\">\n<header style=\"background:#fff;border-bottom:1px solid #e2e8f0;position:sticky;top:0;z-index:30\">\n  <div style=\"padding:18px 32px 14px;display:flex;flex-direction:column;gap:8px\">\n    <div style=\"display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap\">\n      <div style=\"display:flex;align-items:center;gap:10px;min-width:0\">\n        <h1 style=\"margin:0;font-size:26px;font-weight:700;letter-spacing:-0.015em;color:#0f172a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:560px\">{{ project.title }}<\u002Fh1>\n        <span style=\"font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;background:#eef2ff;color:#4338ca;border:1px solid #e0e7ff;white-space:nowrap;font-family:ui-monospace,SFMono-Regular,Menlo,monospace\">{{ project.code }}<\u002Fspan>\n        <button sc-camel-on-click=\"{{ openEditProject }}\" title=\"Edit or rename project\" style=\"padding:5px;border:none;background:none;color:#94a3b8;border-radius:8px;cursor:pointer;display:flex\" style-hover=\"color:#4f46e5;background:#eef2ff\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 20h9\"><\u002Fpath><path d=\"M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n        <button sc-camel-on-click=\"{{ openDeleteModal }}\" title=\"Delete Project\" style=\"padding:5px;border:none;background:none;color:#94a3b8;border-radius:8px;cursor:pointer;display:flex\" style-hover=\"color:#e11d48;background:#fff1f2\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 6h18\"><\u002Fpath><path d=\"M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6\"><\u002Fpath><path d=\"M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:8px\">\n        <button sc-camel-on-click=\"{{ openGuide }}\" title=\"How to use TeamPulse\" style=\"display:inline-flex;align-items:center;gap:6px;padding:7px 12px;font-size:13px;font-weight:600;border-radius:8px;background:#fff;color:#1e293b;border:1px solid #cbd5e1;cursor:pointer;white-space:nowrap\" style-hover=\"background:#f8fafc\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle><path d=\"M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3\"><\u002Fpath><path d=\"M12 17h.01\"><\u002Fpath><\u002Fsvg><span>Help<\u002Fspan><\u002Fbutton>\n        <button sc-camel-on-click=\"{{ openChat }}\" title=\"Open Gemini AI Project Assistant\" style=\"display:inline-flex;align-items:center;gap:6px;padding:7px 12px;font-size:13px;font-weight:600;border-radius:8px;border:none;background:linear-gradient(to right,#4f46e5,#0891b2);color:#fff;cursor:pointer;white-space:nowrap\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 8V4H8\"><\u002Fpath><rect width=\"16\" height=\"12\" x=\"4\" y=\"8\" rx=\"2\"><\u002Frect><path d=\"M2 14h2\"><\u002Fpath><path d=\"M20 14h2\"><\u002Fpath><path d=\"M15 13v2\"><\u002Fpath><path d=\"M9 13v2\"><\u002Fpath><\u002Fsvg><span>AI Assistant<\u002Fspan><\u002Fbutton>\n        <button sc-camel-on-click=\"{{ exportPdf }}\" title=\"Download comprehensive project PDF report with references &amp; status\" style=\"display:inline-flex;align-items:center;gap:6px;padding:7px 12px;font-size:13px;font-weight:600;border-radius:8px;background:#fff;color:#1e293b;border:1px solid #cbd5e1;cursor:pointer;white-space:nowrap\" style-hover=\"background:#f8fafc\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4\"><\u002Fpath><polyline points=\"7 10 12 15 17 10\"><\u002Fpolyline><line x1=\"12\" x2=\"12\" y1=\"15\" y2=\"3\"><\u002Fline><\u002Fsvg><span>PDF Report<\u002Fspan><\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin:0;font-size:13px;color:#64748b;max-width:820px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ project.description }}<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"padding:10px 32px;border-top:1px solid #f1f5f9;display:flex;align-items:center;gap:14px;flex-wrap:wrap\">\n    <button sc-camel-on-click=\"{{ openNewTask }}\" style=\"display:inline-flex;align-items:center;gap:6px;padding:7px 14px;font-size:13.5px;font-weight:600;border-radius:8px;background:#4f46e5;color:#fff;border:none;cursor:pointer;white-space:nowrap\" style-hover=\"background:#4338ca\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12h14\"><\u002Fpath><path d=\"M12 5v14\"><\u002Fpath><\u002Fsvg><span>New task<\u002Fspan><\u002Fbutton>\n    <div style=\"position:relative;display:flex;align-items:center\"><svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#64748b\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"position:absolute;left:10px\"><circle cx=\"11\" cy=\"11\" r=\"8\"><\u002Fcircle><path d=\"m21 21-4.3-4.3\"><\u002Fpath><\u002Fsvg>\n      <input type=\"text\" placeholder=\"Search\" value=\"{{ search }}\" sc-camel-on-change=\"{{ setSearch }}\" style=\"padding:6px 10px 6px 32px;font-size:13px;border-radius:8px;border:1px solid transparent;background:transparent;outline:none;width:180px\" style-focus=\"border-color:#c7d2fe;background:#fff\">\n    <\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:6px\">\n      <span style=\"font-size:13px;color:#475569\">Person<\u002Fspan>\n      <sc-for list=\"{{ teamPills }}\" as=\"tp\" hint-placeholder-count=\"4\">\n        <button sc-camel-on-click=\"{{ tp.onClick }}\" title=\"{{ tp.title }}\" style=\"height:26px;width:26px;border-radius:50%;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;border:none;cursor:pointer;background:{{ tp.av.bg }};color:{{ tp.av.fg }};opacity:{{ tp.opacity }};box-shadow:{{ tp.ring }}\">{{ tp.initials }}<\u002Fbutton>\n      <\u002Fsc-for>\n      <button sc-camel-on-click=\"{{ myTasks.onClick }}\" style=\"font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid #c7d2fe;cursor:pointer;white-space:nowrap;font-weight:600;background:{{ myTasks.bg }};color:{{ myTasks.color }}\">My Tasks<\u002Fbutton>\n    <\u002Fdiv>\n    <sc-raw-select value=\"{{ stageFilter }}\" sc-camel-on-change=\"{{ setStage }}\" title=\"Filter views to only show tasks in a specific stage\" style=\"padding:5px 10px;font-size:13px;font-weight:500;border-radius:8px;cursor:pointer;outline:none;background:{{ stageSel.bg }};color:{{ stageSel.color }};border:1px solid {{ stageSel.border }}\">\n      <option value=\"All\" style=\"background:#fff;color:#0f172a\">All Stages<\u002Foption>\n      <option value=\"Planning\" style=\"background:#fff;color:#0f172a\">Planning Only<\u002Foption>\n      <option value=\"In Progress\" style=\"background:#fff;color:#0f172a\">In Progress Only<\u002Foption>\n      <option value=\"Review\" style=\"background:#fff;color:#0f172a\">Review Only<\u002Foption>\n      <option value=\"Completed\" style=\"background:#fff;color:#0f172a\">Completed Only<\u002Foption>\n    <\u002Fsc-raw-select>\n    <sc-if value=\"{{ hasFilters }}\" hint-placeholder-val=\"{{ false }}\">\n      <button sc-camel-on-click=\"{{ clearFilters }}\" style=\"padding:2px 6px;font-size:12px;font-weight:600;color:#64748b;border:none;background:none;border-radius:6px;cursor:pointer\" style-hover=\"color:#4f46e5\">✕ Clear filters<\u002Fbutton>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<sc-if value=\"{{ isTable }}\" hint-placeholder-val=\"{{ true }}\">\n<main style=\"padding:20px 32px 48px;display:flex;flex-direction:column;gap:30px;min-width:0\">\n  <sc-if value=\"{{ hasSelection }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:sticky;top:150px;z-index:20;align-self:flex-start;display:flex;align-items:center;gap:12px;background:#0f172a;color:#fff;padding:8px 10px 8px 14px;border-radius:12px;box-shadow:0 10px 25px -5px rgba(15,23,42,0.3);font-size:13px\">\n      <span style=\"font-weight:700\">{{ selCount }} selected<\u002Fspan>\n      <sc-raw-select value=\"\" sc-camel-on-change=\"{{ bulkMove }}\" style=\"padding:5px 8px;border-radius:8px;border:1px solid #334155;background:#1e293b;color:#fff;font-size:12px;cursor:pointer\">\n        <option value=\"\">Move to stage…<\u002Foption><option value=\"Planning\">Planning<\u002Foption><option value=\"In Progress\">In Progress<\u002Foption><option value=\"Review\">Review<\u002Foption><option value=\"Completed\">Completed<\u002Foption>\n      <\u002Fsc-raw-select>\n      <button sc-camel-on-click=\"{{ bulkDelete }}\" style=\"padding:5px 10px;border-radius:8px;border:none;background:#e11d48;color:#fff;font-size:12px;font-weight:600;cursor:pointer\">Delete<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ clearSel }}\" title=\"Clear selection\" style=\"border:none;background:none;color:#94a3b8;cursor:pointer;font-size:16px;padding:0 4px\">✕<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n  <sc-if value=\"{{ noProjectTasks }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"background:#fff;border:1px dashed #c7d2fe;border-radius:12px;padding:20px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap\">\n      <div style=\"display:flex;flex-direction:column;gap:4px;max-width:620px\">\n        <span style=\"font-size:15px;font-weight:700;color:#0f172a\">This project has no tasks yet<\u002Fspan>\n        <span style=\"font-size:13px;color:#64748b;line-height:1.5;text-wrap:pretty\">Click <b>New task<\u002Fb>, or type a task name in <b>+ Add task<\u002Fb> under any stage below and press Enter.<\u002Fspan>\n      <\u002Fdiv>\n      <button sc-camel-on-click=\"{{ openGuide }}\" style=\"padding:7px 14px;font-size:13px;font-weight:600;border-radius:8px;background:#eef2ff;color:#4338ca;border:1px solid #c7d2fe;cursor:pointer;white-space:nowrap\">How it works<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n  <sc-for list=\"{{ groups }}\" as=\"g\" hint-placeholder-count=\"4\">\n    <section style=\"display:flex;flex-direction:column;gap:10px\">\n      <button sc-camel-on-click=\"{{ g.onToggle }}\" style=\"display:flex;align-items:center;gap:8px;border:none;background:none;cursor:pointer;padding:0;align-self:flex-start;color:{{ g.text }}\">\n        <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"transform:{{ g.chev }}\"><path d=\"m6 9 6 6 6-6\"><\u002Fpath><\u002Fsvg>\n        <span style=\"font-size:19px;font-weight:600;letter-spacing:-0.01em\">{{ g.name }}<\u002Fspan>\n        <span style=\"font-size:13px;color:#94a3b8;font-weight -top:1px solid rgba(255,255,255,0.1)\">\n      <div style=\"font-size:12px;font-weight:600;color:#94a3b8;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:12px\">Workflow Stage Progression (Beginning to End)<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px\">\n        <sc-for list=\"{{ stepper }}\" as=\"s\" hint-placeholder-count=\"4\">\n          <button sc-camel-on-click=\"{{ s.onClick }}\" style=\"display:flex;align-items:center;justify-content:space-between;padding:12px;border-radius:12px;background:{{ s.bg }};border:1px solid {{ s.border }};text-align:left;cursor:pointer;color:#fff\" style-hover=\"filter:brightness(1.2)\">\n            <div>\n              <span style=\"font-size:10px;font-weight:700;letter-spacing:0.025em;text-transform:uppercase;color:{{ s.label }}\">Stage {{ s.num }}<\u002Fspan>\n              <h4 style=\"margin:0;font-size:14px;font-weight:700;color:#fff\">{{ s.name }}<\u002Fh4>\n              <p style=\"margin:0;font-size:12px;color:{{ s.sub }}\">{{ s.count }} task(s)<\u002Fp>\n            <\u002Fdiv>\n            <span style=\"min-height:28px;min-width:28px;padding:0 4px;border-radius:8px;background:{{ s.badge }};display:flex;align-items:center;justify-content:center;color:{{ s.label }};font-weight:700;font-size:12px\">{{ s.pct }}%<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px\">\n    <sc-for list=\"{{ metrics }}\" as=\"mt\" hint-placeholder-count=\"6\">\n      <div style=\"background:#fff;padding:16px;border-radius:12px;border:1px solid {{ mt.border }};border-left:{{ mt.left }};box-shadow:0 1px 2px rgba(0,0,0,0.05)\">\n        <div style=\"font-size:12px;font-weight:{{ mt.weight }};color:{{ mt.labelColor }}\">{{ mt.label }}<\u002Fdiv>\n        <div style=\"font-size:24px;font-weight:700;color:{{ mt.valueColor }};margin-top:4px\">{{ mt.value }}<\u002Fdiv>\n        <div style=\"font-size:11px;color:{{ mt.noteColor }};font-weight:{{ mt.noteWeight }};margin-top:2px\">{{ mt.note }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ dashAll }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"background:#fff;border-radius:16px;border:1px solid #e2e8f0;box-shadow:0 1px 2px rgba(0,0,0,0.05);overflow:hidden\">\n    <div style=\"padding:16px 20px;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap\">\n      <h3 style=\"margin:0;font-weight:700;color:#1e293b;font-size:16px\">Projects<\u002Fh3>\n      <span style=\"font-size:12px;color:#64748b\">Click a project to open its table<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"overflow-x:auto\">\n      <div style=\"min-width:760px\">\n        <div style=\"display:grid;grid-template-columns:minmax(220px,2fr) 70px repeat(4,80px) minmax(160px,1fr) 80px;padding:8px 20px;font-size:12px;font-weight:600;color:#64748b;background:#f8fafc;border-bottom:1px solid #e2e8f0;gap:8px\">\n          <span>Project<\u002Fspan><span style=\"text-align:center\">Tasks<\u002Fspan><span style=\"text-align:center;color:#2563eb\">Planning<\u002Fspan><span style=\"text-align:center;color:#d97706\">In Progress<\u002Fspan><span style=\"text-align:center;color:#9333ea\">Review<\u002Fspan><span style=\"text-align:center;color:#059669\">Completed<\u002Fspan><span>Progress<\u002Fspan><span style=\"text-align:center\">Overdue<\u002Fspan>\n        <\u002Fdiv>\n        <sc-for list=\"{{ projectRows }}\" as=\"pr\" hint-placeholder-count=\"1\">\n          <div sc-camel-on-click=\"{{ pr.onOpen }}\" style=\"display:grid;grid-template-columns:minmax(220px,2fr) 70px repeat(4,80px) minmax(160px,1fr) 80px;padding:12px 20px;gap:8px;align-items:center;border-bottom:1px solid #f1f5f9;cursor:pointer;font-size:13px;color:#1e293b\" style-hover=\"background:#f8fafc\">\n :0;font-size:12px;color:#64748b\">Dr. Sok Uttara, Mean Udam, Khin Kanika, and Maria Isabelita<\u002Fp>\n        <\u002Fdiv>\n        <span style=\"font-size:12px;font-weight:600;padding:4px 10px;border-radius:8px;background:#eef2ff;color:#4338ca;border:1px solid #e0e7ff\">{{ memberCount }} Active Collaborators<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:12px\">\n        <sc-for list=\"{{ workload }}\" as=\"w\" hint-placeholder-count=\"4\">\n          <div style=\"padding:16px;border-radius:12px;border:1px solid #e2e8f0;background:rgba(248,250,252,0.5)\" style-hover=\"border-color:#a5b4fc\">\n            <div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap\">\n              <div style=\"display:flex;align-items:center;gap:12px\">\n                <div style=\"height:44px;width:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;background:{{ w.av.bg }};color:{{ w.av.fg }}\">{{ w.initials }}<\u002Fdiv>\n                <div>\n                  <div style=\"display:flex;align-items:center;gap:8px;flex-wrap:wrap\">\n                    <h4 style=\"margin:0;font-weight:700;color:#1e293b;font-size:14px\">{{ w.name }}<\u002Fh4>\n                    <span style=\"font-size:10px;padding:2px 8px;border-radius:999px;background:rgba(226,232,240,0.7);color:#334155;font-weight:500\">{{ w.role }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <p style=\"margin:0;font-size:12px;color:#64748b\">{{ w.email }}<\u002Fp>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;align-items:center;gap:16px;margin-left:auto\">\n                <div style=\"text-align:right\">\n                  <div style=\"font-size:12px;font-weight:600;color:#334155\">{{ w.total }} Tasks ({{ w.done }} done)<\u002Fdiv>\n                  <div style=\"font-size:11px;color:#059669;font-weight:600\">{{ w.pct }}% Completion<\u002Fdiv>\n                <\u002Fdiv>\n                <button sc-camel-on-click=\"{{ w.onFilter }}\" style=\"padding:6px 10px;font-size:12px;font-weight:600;border-radius:8px;background:#eef2ff;color:#4338ca;border:none;cursor:pointer;display:flex;align-items:center;gap:4px\" style-hover=\"background:#e0e7ff\">\n                  <span>Filter<\u002Fspan><svg width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m9 18 6-6-6-6\"><\u002Fpath><\u002Fsvg>\n                <\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"margin-top:12px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center;font-size:11px\">\n              <div style=\"padding:4px 8px;border-radius:6px;background:#eff6ff;color:#1d4ed8;font-weight:500\">Planning: {{ w.planning }}<\u002Fdiv>\n              <div style=\"padding:4px 8px;border-radius:6px;background:#fffbeb;color:#b45309;font-weight:500\">In Progress: {{ w.inProgress }}<\u002Fdiv>\n              <div style=\"padding:4px 8px;border-radius:6px;background:#faf5ff;color:#7e22ce;font-weight:500\">Review: {{ w.review }}<\u002Fdiv>\n              <div style=\"padding:4px 8px;border-radius:6px;background:#ecfdf5;color:#047857;font-weight:500\">Done: {{ w.done }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background:#fff;border-radius:16px;border:1px solid #e2e8f0;padding:20px;box-shadow:0 1px 2px rgba(0,0,0,0.05);display:flex;flex-direction:column;justify-content:space-between;min-width:0\">\n      <div>\n        <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:16px\">\n          <div style=\"display:flex;align-items:center;gap:8px\">\n            <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#f59e0b\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\"><\u002Fpath><path d=\"M12 9v4\"><\u002Fpath><path d=\"M12 17h.01\"><\u002Fpath><\u002Fsvg>\n            <h3 style=\"margin:0;font-weight:700;color:#1e293b;font-size:16px\">Attention Required<\u002Fh3>\n          <\u002Fdiv>\n          <span style=\"font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:#fff1f2;color:#be123c\">{{ attentionCount }} High/Urgent<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin:0 0 12px;font-size:12px;color:#64748b\">Tasks in Planning, In Progress, or Review requiring immediate team focus:<\u002Fp>\n        <div style=\"display:flex;flex-direction:column;gap:10px;max-height:380px;overflow-y:auto;padding-right:4px\">\n          <sc-if value=\"{{ noAttention }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"padding:24px;text-align:center;color:#94a3b8;font-size:12px;background:#f8fafc;border-radius:12px\">No high-urgency bottlenecks detected.<\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-for list=\"{{ attention }}\" as=\"at\" hint-placeholder-count=\"0\">\n            <div sc-camel-on-click=\"{{ at.onClick }}\" style=\"padding:12px;border-radius:12px;border:1px solid #e2e8f0;cursor:pointer\" style-hover=\"border-color:#818cf8;background:rgba(238,242,255,0.3)\">\n              <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:8px\">\n                <span style=\"font-size:10px;font-weight:700;padding:2px 8px;border-radius:6px;background:{{ at.pBg }};color:{{ at.pColor }}\">{{ at.priority }}<\u002Fspan>\n                <span style=\"font-size:10px;color:#64748b;font-weight:500\">Due: {{ at.dueDate }}<\u002Fspan>\n              <\u002Fdiv>\n              <h5 style=\"margin:6px 0 0;font-weight:700;font-size:12px;color:#1e293b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ at.title }}<\u002Fh5>\n              <div style=\"display:flex;align-items:center;justify-content:space-between;margin-top:8px;padding-top:8px;border-top:1px solid #f1f5f9;font-size:11px;color:#64748b\">\n                <span style=\"font-weight:600;color:#475569\">{{ at.stage }}<\u002Fspan>\n                <span style=\"color:#4f46e5;display:flex;align-items:center;gap:4px\">Inspect<svg width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12h14\"><\u002Fpath><path d=\"m12 5 7 7-7 7\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"background:#fff;border-radius:16px;border:1px solid #e2e8f0;padding:20px;box-shadow:0 1px 2px rgba(0,0,0,0.05)\">\n    <div style=\"display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:16px;flex-wrap:wrap\">\n      <div>\n        <div style=\"display:flex;align-items:center;gap:8px\">\n          <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#4f46e5\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48\"><\u002Fpath><\u002Fsvg>\n          <h3 style=\"margin:0;font-weight:700;color:#1e293b;font-size:16px\">Recent Links &amp; Uploaded References<\u002Fh3>\n        <\u002Fdiv>\n        <p style=\"margin:0;font-size:12px;color:#64748b\">Shared files, architecture blueprints, research drafts, and cloud links attached to tasks<\u002Fp>\n      <\u002Fdiv>\n      <span style=\"font-size:12px;font-weight:700;padding:4px 10px;border-radius:8px;background:#f1f5f9;color:#334155\">{{ dashRefCount }} Attached Materials<\u002Fspan>\n    <\u002Fdiv>\ px\" style-hover=\"color:#475569\">\n        <svg width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8\"><\u002Fpath><path d=\"M3 3v5h5\"><\u002Fpath><\u002Fsvg><span>Reset Tasks<\u002Fspan>\n      <\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffooter>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ newTaskOpen }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(15,23,42,0.6);backdrop-filter:blur(4px);overflow-y:auto\">\n  <div style=\"background:#fff;border-radius:16px;box-shadow:0 25px 50px -12px rgba(0,0,0,0.25);border:1px solid #e2e8f0;max-width:672px;width:100%;margin:32px 0;overflow:hidden\">\n    <div style=\"background:#0f172a;padding:16px 24px;color:#fff;display:flex;align-items:center;justify-content:space-between\">\n      <div>\n        <h3 style=\"margin:0;font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#818cf8\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12h14\"><\u002Fpath><path d=\"M12 5v14\"><\u002Fpath><\u002Fsvg>Create New Task<\u002Fh3>\n        <p style=\"margin:0;font-size:12px;color:#cbd5e1\">Set lifecycle stage, assign team members, and upload reference links<\u002Fp>\n      <\u002Fdiv>\n      <button sc-camel-on-click=\"{{ closeNewTask }}\" style=\"padding:4px;border-radius:8px;border:none;background:none;color:#94a3b8;cursor:pointer;display:flex\" style-hover=\"color:#fff;background:#1e293b\">\n        <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M18 6 6 18\"><\u002Fpath><path d=\"m6 6 12 12\"><\u002Fpath><\u002Fsvg>\n      <\u002Fbutton>\n    <\u002Fdiv>\n    <div style=\"padding:24px;display:flex;flex-direction:column;gap:20px;max-height:80vh;overflow-y:auto\">\n      <div>\n        <label style=\"display:block;font-size:12px;font-weight:700;color:#334155;text-transform:uppercase;margin-bottom:4px\">Task Title *<\u002Flabel>\n        <input type=\"text\" placeholder=\"e.g., Draft Clinical Data Privacy Safeguards\" value=\"{{ tf.title }}\" sc-camel-on-change=\"{{ tfSet.title }}\" style=\"width:100%;padding:8px 12px;font-size:14px;border-radius:12px;border:1px solid {{ tfTitleBorder }};outline:none;font-weight:500\">\n      <\u002Fdiv>\n      <div>\n        <label style=\"display:block;font-size:12px;font-weight:700;color:#334155;text-transform:uppercase;margin-bottom:4px\">Description &amp; Objectives<\u002Flabel>\n        <textarea rows=\"3\" placeholder=\"Provide context, deliverables, and operational requirements...\" value=\"{{ tf.description }}\" sc-camel-on-change=\"{{ tfSet.description }}\" style=\"width:100%;padding:8px 12px;font-size:12px;border-radius:12px;border:1px solid #cbd5e1;outline:none;resize:vertical\"><\u002Ftextarea>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px\">\n        <div>\n          <label style=\"display:block;font-size:12px;font-weight:700;color:#334155;text-transform:uppercase;margin-bottom:4px\">Lifecycle Stage (Beginning to End) *<\u002Flabel>\n          <sc-raw-select value=\"{{ tf.stage }}\" sc-camel-on-change=\"{{ tfSet.stage }}\" style=\"width:100%;padding:8px 12px;font-size:12px;font-weight:600;border-radius:12px;border:1px solid #cbd5e1;background:#fff\">\n            <option value=\"Planning\">1. Planning (Scoping &amp; Charter)<\u002Foption><option value=\"In Progress\">2. In Progress (Active Development)<\u002Foption><option value=\"Review\">3. Review (QA &amp; Ethics Audit)<\u002Foption><option value=\"Completed\">4. Completed (Signed-off Deliverable)<\u002Foption>\n          <\u002Fsc-raw-select>\n        <\u002Fdiv>\n        <div>\n          <label style=\"display:block;font-size:12px;font-weight:700;color:#334155;text-transform:uppercase;margin-bottom:4px\">Priority Level *<\u002Flabel>\n          <sc-raw-select value=\"{{ tf.priority }}\" sc-camel-on-change=\"{{ tfSet.priority }}\" style=\"width:100%;padding:8px 12px;font-size:12px;font-weight:600;border-radius:12px;border:1px solid #cbd5e1;background:#fff\">\n            <option value=\"Low\">Low Priority<\u002Foption><option value=\"Medium\">Medium Priority<\u002Foption><option value=\"High\">High Priority<\u002Foption><option value=\"Urgent\">Urgent (Action Required)<\u002Foption>\n          <\u002Fsc-raw-select>\n        <\u002Fdiv>\n        <div>\n          <label style=\"display:block;font-size:12px;font-weight:700;color:#334155;text-transform:uppercase;margin-bottom:4px\">Start Date<\u002Flabel>\n          <input type=\"date\" value=\"{{ tf.startDate }}\" sc-camel-on-change=\"{{ tfSet.startDate }}\" style=\"width:100%;padding:8px 12px;font-size:12px;border-radius:12px;border:1px solid #cbd5e1\">\n        <\u002Fdiv>\n        <div>\n          <label style=\"display:block;font-size:12px;font-weight:700;color:#334155;text-transform:uppercase;margin-bottom:4px\">Due Date<\u002Flabel>\n          <input type=\"date\" value=\"{{ tf.dueDate }}\" sc-camel-on-change=\"{{ tfSet.dueDate }}\" style=\"width:100%;padding:8px 12px;font-size:12px;border-radius:12px;border:1px solid #cbd5e1\">\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <label style=\"display:block;font-size:12px;font-weight:700;color:#334155;text-transform:uppercase;margin-bottom:6px\">Assign Team Members *<\u002Flabel>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px\">\n          <sc-for list=\"{{ tfMembers }}\" as=\"m\" hint-placeholder-count=\"4\">\n            <button 12px;border:1px solid #e2e8f0\">\n            <sc-for list=\"{{ tfSubs }}\" as=\"s\" hint-placeholder-count=\"0\">\n              <div style=\"display:flex;align-items:center;justify-content:space-between;font-size:12px;padding:4px 8px;background:#fff;border-radius:4px;border:1px solid #e2e8f0\">\n                <span style=\"color:#334155\">{{ s.title }}<\u002Fspan>\n                <button type=\"button\" sc-camel-on-click=\"{{ s.onRemove }}\" style=\"color:#94a3b8;border:none;background:none;cursor:pointer;display:flex;padding:0\" style-hover=\"color:#e11d48\"><svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 6h18\"><\u002Fpath><path d=\"M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6\"><\u002Fpath><path d=\"M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"border-top:1px solid #e2e8f0;padding-top:16px;display:flex;flex-direction:column;gap:12px\">\n        <div style=\"display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap\">\n          <div>\n            <label style=\"display:block;font-size:12px;font-weight:700;color:#334155;text-transform:uppercase\">Add Link or Upload Reference File<\u002Flabel>\n            <p style=\"margin:0;font-size:11px;color:#64748b\">Share reference links, specs, documentation, or upload files directly<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display:flex;background:#f1f5f9;padding:2px;border-radius:8px;border:1px solid #e2e8f0\">\n            <button type=\"button\" sc-camel-on-click=\"{{ tfRefLink }}\" style=\"padding:4px 8px;font-size:12px;font-weight:700;border-radius:6px;border:none;cursor:pointer;background:{{ tfLinkTab.bg }};color:{{ tfLinkTab.color }};box-shadow:{{ tfLinkTab.shadow }}\">Web Link
